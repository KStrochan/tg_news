name: Post Stryi news to Telegram

on:
  schedule:
    # Час у cron — UTC, зараз зимовий час (Київ = UTC+2).
    # Хвилини навмисно не :00 — у цю хвилину GitHub перевантажений і відкладає запуски на години.
    # Запуск ставимо трохи раніше, бо GitHub зазвичай стартує із запізненням 5–20 хв.
    - cron: "43 5 * * *"   # ~07:45–08:05 Київ
    - cron: "43 9 * * *"   # ~11:45–12:05 Київ
    - cron: "43 13 * * *"  # ~15:45–16:05 Київ
    - cron: "43 16 * * *"  # ~18:45–19:05 Київ
  workflow_dispatch: {}   # дозволяє запускати вручну кнопкою "Run workflow"

permissions:
  contents: write

concurrency:
  group: post-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
          CHANNEL_TITLE: "Стрий | Новини Стрийщини"
          IMAGE_PROVIDER: card
          POSTS_PER_RUN: 1
        run: python main.py

      - name: Save posted-news history back to repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          [ -f posted_news.json ] || exit 0
          git add posted_news.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update posted news history [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
