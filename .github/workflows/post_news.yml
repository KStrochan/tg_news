name: Post Stryi news to Telegram

on:
  schedule:
    # Кожні 2 години з ~8:00 до ~22:00 за Києвом (зимовий час, Київ = UTC+2).
    # Хвилина :43 — не :00, бо о :00 GitHub перевантажений і відкладає запуски на години.
    # Якщо цікавої новини (оцінка ≥ 5) немає — запуск нічого не публікує і майже нічого не коштує.
    - cron: "43 5,7,9,11,13,15,17,19 * * *"
  workflow_dispatch: {}   # дозволяє запускати вручну кнопкою "Run workflow"

permissions:
  contents: write

concurrency:
  group: post-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5
          CHANNEL_TITLE: "Стрий | Новини Стрийщини"
          IMAGE_PROVIDER: card
          POSTS_PER_RUN: 1
          RANK_MODEL: claude-haiku-5-5
        run: python main.py

      - name: Save posted-news history back to repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          [ -f posted_news.json ] || exit 0
          git add posted_news.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update posted news history [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
