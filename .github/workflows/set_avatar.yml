name: Set channel avatar

# Запуск вручну: Actions → Set channel avatar → Run workflow.
# Бере assets/avatar.jpg з репозиторію і ставить його аватаркою каналу.
on:
  workflow_dispatch: {}

jobs:
  avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 python-dotenv==1.0.1
      - name: Set avatar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ANTHROPIC_API_KEY: unused
        run: python set_avatar.py
